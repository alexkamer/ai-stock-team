[project]
name = "ai-stock-team"
version = "0.1.0"
description = "AI-powered stock snapshot CLI, built on pydantic-ai + yfinance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[bedrock]>=2.19.0",
    "pyyaml>=6.0.3",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
main = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/core"]

[tool.hatch.build.targets.wheel.force-include]
"src/core/config.yaml" = "core/config.yaml"

[project.scripts]
ai-stock-team = "agents.main:main"
